name: Build CP Bootable USB

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]   # publishing a Release on github.com attaches the exe zip automatically
  workflow_dispatch:

permissions:
  contents: write   # needed to publish a GitHub Release when a v* tag is pushed

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CPBootableUSB.sln

      - name: Build (Release)
        run: dotnet build CPBootableUSB.sln -c Release --no-restore

      # Portable single-file UsbMaker.exe (settings live in UsbMaker.csproj): no .NET install needed, opens instantly.
      - name: Publish portable UsbMaker.exe
        run: dotnet publish src/UsbMaker/UsbMaker.csproj -c Release -o publish

      - name: Prepare single exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item publish/UsbMaker.exe "dist/CP-Bootable-USB.exe"
          Get-ChildItem publish, dist | Select-Object FullName, Length

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("${{ github.ref }}" -like "refs/tags/v*") { $v = "${{ github.ref_name }}".TrimStart('v') }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      # Windows installer: installs to Program Files\COMPUTER PLUS\CP Bootable USB, one Desktop icon.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/DPublishDir=..\publish" installer\CPBootableUSB.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload BootLauncher (WinPE app)
        uses: actions/upload-artifact@v4
        with:
          name: BootLauncher-net48
          path: src/BootLauncher/bin/Release/net48/
          if-no-files-found: error

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: CP-Bootable-USB-portable-win-x64
          path: dist/CP-Bootable-USB.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CP-Bootable-USB-Setup
          path: dist/CP-Bootable-USB-Setup-*.exe
          if-no-files-found: error

      - name: Name release exe
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Copy-Item "dist/CP-Bootable-USB.exe" "dist/CP-Bootable-USB-${{ github.ref_name }}-win-x64.exe"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CP-Bootable-USB-Setup-*.exe
            dist/CP-Bootable-USB-${{ github.ref_name }}-win-x64.exe
          tag_name: ${{ github.ref_name }}
          generate_release_notes: ${{ github.event_name != 'release' }}
