name: Build CP Bootable USB

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish a GitHub Release when a v* tag is pushed

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CPBootableUSB.sln

      - name: Build (Release)
        run: dotnet build CPBootableUSB.sln -c Release --no-restore

      # Single self-contained UsbMaker.exe: runs on any Windows 10/11 x64 PC without installing .NET.
      - name: Publish UsbMaker.exe
        run: >
          dotnet publish src/UsbMaker/UsbMaker.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/UsbMaker

      - name: Add docs to package
        shell: pwsh
        run: |
          Copy-Item README.md publish/UsbMaker/
          Copy-Item docs/ARCHITECTURE.md publish/UsbMaker/
          New-Item -ItemType Directory -Force publish/UsbMaker/Payload | Out-Null
          Copy-Item src/UsbMaker/Payload/README.txt publish/UsbMaker/Payload/
          Get-ChildItem publish/UsbMaker -Recurse | Select-Object FullName, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CP-Bootable-USB-UsbMaker-win-x64
          path: publish/UsbMaker
          if-no-files-found: error

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path publish/UsbMaker/* -DestinationPath "CP-Bootable-USB-${{ github.ref_name }}-win-x64.zip"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CP-Bootable-USB-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
